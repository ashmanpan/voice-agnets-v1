version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: voiceagent
      POSTGRES_PASSWORD: voiceagent
      POSTGRES_DB: voiceagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceagent"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: kpanse/voice-agents-app:latest
    ports:
      - "8001:8000"
    volumes:
      # Only mount recordings (for call recordings), NO code mount
      - ./recordings:/recordings
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://voiceagent:voiceagent@db:5432/voiceagent
    depends_on:
      db:
        condition: service_healthy
    # No --reload flag in production
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  livekit-agent:
    image: kpanse/voice-agents-livekit-agent:latest
    env_file:
      - livekit-agent/.env
    restart: unless-stopped
    # No volume mount - all code in image

volumes:
  postgres_data:
