version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: voiceagent
      POSTGRES_PASSWORD: voiceagent
      POSTGRES_DB: voiceagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema is applied by the app's entrypoint via Alembic (see Dockerfile),
      # not a static SQL dump, so it always matches the models.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceagent"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8001:8000"
    volumes:
      - ./app:/app
      - ./recordings:/recordings
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://voiceagent:voiceagent@db:5432/voiceagent
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  livekit-agent:
    build: ./livekit-agent
    volumes:
      - ./livekit-agent:/app
    env_file:
      - livekit-agent/.env
    restart: unless-stopped
    # This agent connects to LiveKit Cloud, no port mapping needed
    # It will receive audio streams via WebRTC from LiveKit servers

volumes:
  postgres_data:
